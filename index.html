<!DOCTYPE html>
<hmtl>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToDoList in JS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="todo-app">
                <h1>To-Do app</h1>
                <form class="input-area">
                    <input type="text" id="task-input" placeholder="Add new task...">
                    <button type="submit" id="add-task-btn">+</button>
                </form>
            </div>
            <div class="todo-container">
                <ul id="task-list"></ul>
            </div>
        </div>
    </body>
</hmtl>
